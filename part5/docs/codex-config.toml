# Evidence copy of the Codex CLI configuration. Two files, both in ~/.codex/.
#
# No key appears here or in either real file. `env_key` names an environment
# variable; OPENROUTER_API_KEY is set as a Windows *user* environment variable
# so it survives closing the terminal, which a shell export does not. The
# OpenAI side holds no key at all -- it authenticates through the ChatGPT
# subscription via `codex login`.
#
# The two reviewers end up one flag apart:
#
#   codex exec "..."                 -> OpenAI, on the ChatGPT plan
#   codex -p openrouter exec "..."   -> z-ai/glm-5.2, on OpenRouter
#
# Verified with codex-cli 0.153.2 on 2026-09-04.


# ===========================================================================
# ~/.codex/config.toml  -- base
# ===========================================================================
# Nothing here selects a provider, so Codex uses its own default (openai).
# The openrouter provider is *defined* here rather than in the profile,
# because provider definitions have to sit in the user-level config.
# Confirmed: `codex doctor` reports "default model provider: openai".

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

# The [projects.*] trust entries Codex writes for itself are omitted here.


# ===========================================================================
# ~/.codex/openrouter.config.toml  -- the open-weight reviewer
# ===========================================================================
# Selected with `-p openrouter`. Only flips the provider and model; everything
# else is inherited from the base config.
#
#   model_provider = "openrouter"
#   model = "z-ai/glm-5.2"
#
# Confirmed working: a run with -p openrouter reports
#   model: z-ai/glm-5.2
#   provider: openrouter


# ===========================================================================
# Where the course text is out of date
# ===========================================================================
#
# 1. PROFILES MOVED. The text describes a [profiles.<name>] block inside
#    config.toml. That does not exist in 0.153.2. `-p/--profile` takes a
#    CONFIG_PROFILE_V2 and "layers $CODEX_HOME/<name>.config.toml on top of the
#    base user config" -- a separate file. The structure above is that
#    mechanism, working.
#
# 2. --profile IS NOT GLOBAL. It applies only to runtime commands: codex,
#    exec, review, resume, queue, archive, delete, unarchive, fork, mcp,
#    sandbox, debug prompt-input. `codex -p <name> doctor` is an error, which
#    is easy to trip over while verifying a profile.
#
# 3. wire_api = "responses" IS CORRECT. The risk logged against it at the start
#    of this part was wrong. OpenRouter serves /responses; "chat" was never
#    needed.
#
# 4. THE MODEL SLUG EXISTS. z-ai/glm-5.2 is real, and so is z-ai/glm-5.2:free.
#    The free variant is not usable for this: it returns 429 Too Many Requests
#    after Codex exhausts its internal retries.
#
# 5. THE SANDBOX IS THE REAL TRAP, AND IS NOT MENTIONED AT ALL. On Windows,
#    --sandbox read-only and --sandbox workspace-write both reject every
#    CreateProcess, including `cmd.exe /c dir`, so the agent can reason but
#    cannot look at anything. Only --sandbox danger-full-access works, which
#    means reviewing a repo on Windows costs you the read-only guarantee.
#    Mitigate with a clean, pushed working tree.

# Codex CLI — OpenRouter provider, as described in the Part 5 course text.
# Provider definitions must live in the user-level config; a project-local
# config.toml ignores them.

model_provider = "openrouter"
model = "z-ai/glm-5.2"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

[projects.'c:\users\ehhal\appdata\local\temp\claude\c--projects-turingcollege-bwai-sprint4-part5\44adcd53-0f41-47a1-804f-d8b00c8e7474\scratchpad\codex-smoke']
trust_level = "trusted"

